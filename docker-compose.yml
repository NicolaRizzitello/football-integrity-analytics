services:
  postgres:
    image: postgres:15
    container_name: football-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.9.3-python3.11
    container_name: football-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONPATH: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas requests psycopg2-binary sqlalchemy pyyaml"
    volumes: &airflow-common-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./ingestion:/opt/airflow/ingestion
      - ./config:/opt/airflow/config
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Football --lastname Analyst --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.11
    container_name: football-airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
      FOOTBALL_DB_HOST: postgres
      FOOTBALL_DB_PORT: 5432
      FOOTBALL_DB_NAME: football
      FOOTBALL_DB_USER: airflow
      FOOTBALL_DB_PASSWORD: airflow
    volumes: *airflow-common-volumes
    ports:
      - "8080:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.11
    container_name: football-airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-env
      FOOTBALL_DB_HOST: postgres
      FOOTBALL_DB_PORT: 5432
      FOOTBALL_DB_NAME: football
      FOOTBALL_DB_USER: airflow
      FOOTBALL_DB_PASSWORD: airflow
    volumes: *airflow-common-volumes
    command: scheduler
    restart: unless-stopped

volumes:
  postgres_data:
